<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#25c2a0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a8870;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background Circle -->
  <circle cx="100" cy="100" r="90" fill="url(#gradient)" opacity="0.1"/>
  
  <!-- Main ENS-style hexagon -->
  <polygon points="100,20 160,60 160,140 100,180 40,140 40,60" 
           fill="url(#gradient)" 
           stroke="url(#gradient)" 
           stroke-width="2"/>
  
  <!-- Inner content representing granular permissions -->
  <circle cx="100" cy="100" r="30" fill="white" opacity="0.9"/>
  
  <!-- Permission dots -->
  <circle cx="85" cy="85" r="3" fill="#25c2a0"/>
  <circle cx="115" cy="85" r="3" fill="#25c2a0"/>
  <circle cx="85" cy="115" r="3" fill="#25c2a0"/>
  <circle cx="115" cy="115" r="3" fill="#25c2a0"/>
  <circle cx="100" cy="100" r="2" fill="#1a8870"/>
  
  <!-- Connection lines -->
  <line x1="85" y1="85" x2="100" y2="100" stroke="#25c2a0" stroke-width="1" opacity="0.6"/>
  <line x1="115" y1="85" x2="100" y2="100" stroke="#25c2a0" stroke-width="1" opacity="0.6"/>
  <line x1="85" y1="115" x2="100" y2="100" stroke="#25c2a0" stroke-width="1" opacity="0.6"/>
  <line x1="115" y1="115" x2="100" y2="100" stroke="#25c2a0" stroke-width="1" opacity="0.6"/>
</svg>
