version: 1
agent:
  clone:
    depth: 1
    ref:
      type: branch
      name: <+inputs.branch>
    repo: <+inputs.repo>
    connector: "<+inputs.gitConnector != null ? inputs.gitConnector.id : ''>"

  inputs:
    repo:
      type: string
      required: true
    branch:
      type: string
      default: main
    gitConnector:
      type: connector

  stages:
    - name: reconcile-docs
      id: docs
      platform:
        os: linux
        arch: arm64
      steps:
        - name: docs-agent
          agent:
            container:
              image: pkg.harness.io/vrvdt5ius7uwygso8s0bia/harness-agents/claude-code-plugin:main
            env:
              ANTHROPIC_MODEL: arn:aws:bedrock:us-east-1:587817102444:application-inference-profile/7p8sn93lhspw
              AWS_BEARER_TOKEN_BEDROCK: <+secrets.getValue("bedrock_api_key")>
              AWS_REGION: us-east-1
              CLAUDE_CODE_USE_BEDROCK: "1"
            task: |
              You are the Docs Reconciliation agent for ENS Granular.

              ## Goals
              1. `docs/sidebars.js` must only reference pages that exist under docs/docs/
              2. README.md scripts must match root package.json (dev:ui, not dev for UI)
              3. Remove or mark "planned" references to: TypeScript SDK, Seaport marketplace, ENSIP-19 if not implemented
              4. Reconcile architecture docs: GNA vs naming delegation narrative
              5. Ensure `npm run docs:build` passes
              6. Add agents/README.md link from main README

              ## Workflow
              1. Run `npm run docs:build`
              2. Fix broken links and missing pages (create stubs OR remove sidebar entries)
              3. Update root README Quick Start for accurate commands
              4. Write `.agent/output/docs-report.md` listing doc debt remaining
              5. Update ASSEMBLY_STATUS.md; commit and open draft PR

              ## RULES
              - Do not invent features in docs that have no code
              - Mark future work clearly as "Planned" with issue links when possible
              - Keep Docusaurus plugin IDs unique
            mcp_servers:
              github:
                url: https://api.githubcopilot.com/mcp/
                headers:
                  Authorization: Bearer <+secrets.getValue("github_pat")>
            with:
              allowed_tools: Read,Edit,Write,Bash,Glob,Grep,mcp__github__*
              log_file: .agent/output/docs-log.jsonl
            max_turns: 150
