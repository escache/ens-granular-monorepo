version: 1
agent:
  clone:
    depth: 1
    ref:
      type: branch
      name: <+inputs.branch>
    repo: <+inputs.repo>
    connector: "<+inputs.gitConnector != null ? inputs.gitConnector.id : ''>"

  inputs:
    repo:
      type: string
      required: true
    branch:
      type: string
      default: main
    gitConnector:
      type: connector

  stages:
    - name: implement-cli
      id: cli
      platform:
        os: linux
        arch: arm64
      steps:
        - name: cli-agent
          agent:
            container:
              image: pkg.harness.io/vrvdt5ius7uwygso8s0bia/harness-agents/claude-code-plugin:main
            env:
              ANTHROPIC_MODEL: arn:aws:bedrock:us-east-1:587817102444:application-inference-profile/7p8sn93lhspw
              AWS_BEARER_TOKEN_BEDROCK: <+secrets.getValue("bedrock_api_key")>
              AWS_REGION: us-east-1
              CLAUDE_CODE_USE_BEDROCK: "1"
            task: |
              You are the CLI Implementation agent for ENS Granular (packages/cli).

              ## Critical fixes
              1. Replace all `// TODO` stubs in factory.ts, delegate.ts, granular.ts, utils.ts with real viem calls OR exit with clear NOT_IMPLEMENTED error — never fake success
              2. Add `packages/cli/.env.example` and load dotenv in config.ts
              3. Align CHAIN_ID with NETWORK in config.ts
              4. Remove deprecated Goerli; default to Sepolia for testnet
              5. Add jest tests for utils commands (namehash, normalize) at minimum
              6. Share ABIs from packages/cli/src/abis or import from contracts artifacts

              ## Workflow
              1. Grep for TODO in packages/cli/src/commands
              2. Implement one command group per run (factory OR delegate OR granular)
              3. `npm run build --workspace=@ens-granular/cli`
              4. Test utils without PRIVATE_KEY; document wallet-required commands
              5. Write `.agent/output/cli-report.md`
              6. Update ASSEMBLY_STATUS.md; commit and open draft PR

              ## RULES
              - PRIVATE_KEY only required for write commands
              - Use getPublicClient/getWalletClient from config.ts
              - Structured JSON output flag `--json` where practical for CI
            mcp_servers:
              github:
                url: https://api.githubcopilot.com/mcp/
                headers:
                  Authorization: Bearer <+secrets.getValue("github_pat")>
            with:
              allowed_tools: Read,Edit,Write,Bash,Glob,Grep,mcp__github__*
              log_file: .agent/output/cli-log.jsonl
            max_turns: 200
