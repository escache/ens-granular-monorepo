version: 1
agent:
  clone:
    depth: 1
    ref:
      type: branch
      name: <+inputs.branch>
    repo: <+inputs.repo>
    connector: "<+inputs.gitConnector != null ? inputs.gitConnector.id : ''>"

  inputs:
    repo:
      type: string
      required: true
    branch:
      type: string
      default: main
    gitConnector:
      type: connector

  stages:
    - name: gate
      id: integration_gate
      platform:
        os: linux
        arch: arm64
      steps:
        - name: assembly-gate
          run:
            shell: bash
            script: |-
              chmod +x scripts/assembly-gate.sh
              scripts/assembly-gate.sh

        - name: summarize-gate
          agent:
            container:
              image: pkg.harness.io/vrvdt5ius7uwygso8s0bia/harness-agents/claude-code-plugin:main
            env:
              ANTHROPIC_MODEL: arn:aws:bedrock:us-east-1:587817102444:application-inference-profile/7p8sn93lhspw
              AWS_BEARER_TOKEN_BEDROCK: <+secrets.getValue("bedrock_api_key")>
              AWS_REGION: us-east-1
              CLAUDE_CODE_USE_BEDROCK: "1"
            task: |
              Read `.agent/output/gate-report.json`.

              1. Update `agents/ASSEMBLY_STATUS.md`:
                 - Set Integration Gate status to pass/fail
                 - Paste gate summary under "## Gate Results (latest)"
                 - List failing checks with file hints if inferable from logs

              2. If any check failed, write `.agent/output/gate-remediation.md` with:
                 - Root cause hypothesis per failure
                 - Suggested owning workstream (contracts/ui/cli/docs)
                 - Exact commands to reproduce locally

              ## RULES
              - Do not change source code in this agent — report only
              - Keep ASSEMBLY_STATUS.md table format intact
            with:
              allowed_tools: Read,Write,Glob
              log_file: .agent/output/integration-gate-log.jsonl
            max_turns: 50
