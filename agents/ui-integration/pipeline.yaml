version: 1
agent:
  clone:
    depth: 1
    ref:
      type: branch
      name: <+inputs.branch>
    repo: <+inputs.repo>
    connector: "<+inputs.gitConnector != null ? inputs.gitConnector.id : ''>"

  inputs:
    repo:
      type: string
      required: true
    branch:
      type: string
      default: main
    gitConnector:
      type: connector

  stages:
    - name: integrate-ui
      id: ui
      platform:
        os: linux
        arch: arm64
      steps:
        - name: ui-agent
          agent:
            container:
              image: pkg.harness.io/vrvdt5ius7uwygso8s0bia/harness-agents/claude-code-plugin:main
            env:
              ANTHROPIC_MODEL: arn:aws:bedrock:us-east-1:587817102444:application-inference-profile/7p8sn93lhspw
              AWS_BEARER_TOKEN_BEDROCK: <+secrets.getValue("bedrock_api_key")>
              AWS_REGION: us-east-1
              CLAUDE_CODE_USE_BEDROCK: "1"
            task: |
              You are the UI Integration agent for ENS Granular (packages/ui).

              ## Critical fixes (priority order)
              1. Wire `AppContext` (`selectedDelegate`, `selectedGranularDelegate`, `resolverAddress`) into all tabs in `EnterpriseApp.tsx` — pass `delegateAddress` props to DelegationManagement, GranularPermissions, EmergencyControls, BatchOperations, etc.
              2. Connect `FactoryOperations` delegate selection callbacks to `AppContext` setters
              3. Support env-driven contract addresses via `VITE_*` in `packages/ui/src/config/contracts.ts`
              4. Add React Error Boundary in `main.tsx`
              5. Use `getErrorMessage()` consistently in TransactionStatus
              6. Accessibility: dialog roles, aria labels on EnterpriseConnectButton and ConfirmationDialog
              7. Remove or fix dead shells (App.tsx, ModernApp.tsx) if they block builds

              ## Workflow
              1. Read `agents/ASSEMBLY_STATUS.md` and gate report if present
              2. Implement highest-priority UI fix
              3. Run `npm run test:ui --workspace=@ens-granular/ui -- --run`
              4. Run `npm run build --workspace=@ens-granular/ui`
              5. Write `.agent/output/ui-report.md`
              6. Update ASSEMBLY_STATUS.md; commit and open draft PR

              ## RULES
              - EnterpriseApp is the canonical entry (main.tsx)
              - wagmi v2 — do not use connector.ready
              - Match existing enterprise.css styling
              - No hardcoded private keys
            mcp_servers:
              github:
                url: https://api.githubcopilot.com/mcp/
                headers:
                  Authorization: Bearer <+secrets.getValue("github_pat")>
            with:
              allowed_tools: Read,Edit,Write,Bash,Glob,Grep,mcp__github__*
              log_file: .agent/output/ui-log.jsonl
            max_turns: 200
